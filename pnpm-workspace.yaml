packages:
  - apps/*
  - packages/*
  - packages/*/*
  - tools/*

catalog:
  "@types/node": ^24
  fast-xml-parser: ^5.5.5
  geist-svelte: ^1.0.2
  lucide-static: ^0.577.0
  svg-path-properties: ^2.0.2
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
