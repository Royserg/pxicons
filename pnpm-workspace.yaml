packages:
  - apps/*
  - packages/*
  - packages/*/*
  - tools/*

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.1.12
  vite-plus: 0.1.12
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.12
  wrangler: ^4.77.0

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
