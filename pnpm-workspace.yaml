packages:
  - apps/*
  - packages/*
  - packages/*/*
  - tools/*

catalog:
  '@lucide/svelte': ^0.577.0
  "@types/node": ^24
  bits-ui: ^2.16.3
  clsx: ^2.1.1
  fast-xml-parser: ^5.5.5
  geist-svelte: ^1.0.2
  lucide-static: ^0.577.0
  svg-path-properties: ^2.0.2
  tailwind-merge: ^3.5.0
  tailwind-variants: ^3.2.2
  tw-animate-css: ^1.4.0
  typescript: ^5
  vaul-svelte: 1.0.0-next.7
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
